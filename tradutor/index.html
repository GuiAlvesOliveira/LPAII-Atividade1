<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tradutor de #hashtags e @menções</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 30px auto;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 16px;
    }
    button {
      margin: 10px 0;
      padding: 8px 16px;
      font-size: 16px;
    }
    #saida {
      border: 1px solid #ccc;
      padding: 10px;
      min-height: 40px;
      white-space: pre-wrap;
    }
    .erro {
      background: #fdd;
      color: #900;
    }
  </style>
</head>
<body>
  <h1>Tradutor de #hashtags e @menções</h1>

  <textarea id="entrada" placeholder="Digite seu texto aqui"></textarea>
  <br>
  <button id="botao">Traduzir</button>

  <h3>Resultado</h3>
  <div id="saida"></div>
  <p id="contador"></p>

  <h3>Erros encontrados</h3>
  <ul id="erros"></ul>

  <script>
    const emojis = {
      "frutas:banana": "🍌",
      "frutas:uva": "🍇",
      "frutas:maçã": "🍎",
      "animais:gato": "🐱",
      "animais:cachorro": "🐶",
      "comidas:pizza": "🍕",
      "comidas:hamburguer": "🍔",
      "frutas:laranja": "🍊",
      "frutas:morango": "🍓",
      "animais:peixe": "🐟",
      "comidas:sorvete": "🍦"
    };

    const pessoas = {
      "joao": "João da Silva",
      "maria": "Maria Oliveira",
      "ana": "Ana Souza",
      "pedro": "Pedro Santos",
      "carlos": "Carlos Pereira",
      "julia": "Júlia Costa",
      "lucas": "Lucas Almeida"
    };

    function marcarErro(trecho) {
      return '<span class="erro">' + trecho + "</span>";
    }

    function substituirMencoes(texto, erros) {
      const padrao = /@([\wÀ-ÿ]+)/g;

      return texto.replace(padrao, function (trecho, usuario) {
        const chave = usuario.toLowerCase();

        if (!Object.hasOwn(pessoas, chave)) {
          erros.push("Menção desconhecida: " + trecho);
          return marcarErro(trecho);
        }

        return pessoas[chave];
      });
    }

    function substituirHashtags(texto, erros) {
      const padrao = /#([\wÀ-ÿ]+)(?::([\wÀ-ÿ]+))?/g;

      return texto.replace(padrao, function (trecho, categoria, valor) {
        if (valor === undefined) {
          erros.push(
            "Hashtag em formato inválido: " + trecho + " (use #categoria:valor)"
          );
          return marcarErro(trecho);
        }

        const chave = (categoria + ":" + valor).toLowerCase();

        if (!Object.hasOwn(emojis, chave)) {
          erros.push("Hashtag desconhecida: " + trecho);
          return marcarErro(trecho);
        }

        return emojis[chave];
      });
    }

    function escaparHtml(texto) {
      return texto
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function traduzir() {
      const erros = [];
      let texto = escaparHtml(document.getElementById("entrada").value);

      texto = substituirMencoes(texto, erros);
      texto = substituirHashtags(texto, erros);

      document.getElementById("saida").innerHTML = texto;

      const lista = document.getElementById("erros");
      lista.innerHTML = "";

      if (erros.length === 0) {
        lista.innerHTML = "<li>Nenhum erro encontrado.</li>";
      }

      for (const mensagem of erros) {
        const item = document.createElement("li");
        item.className = "erro";
        item.textContent = mensagem;
        lista.appendChild(item);
      }
    }

    document.getElementById("botao").addEventListener("click", traduzir);

    // ==================== Desafios extras ====================

    // Desafio 1: contadores de menções e hashtags traduzidas com sucesso
    let mencoesTraduzidas = 0;
    let hashtagsTraduzidas = 0;

    // Desafio 3: pessoa com ponto no nome de usuário
    pessoas["maria.silva"] = "Maria da Silva";

    // Desafios 1, 2 e 3: substituirMencoes com contador e regex nova
    function substituirMencoesDesafio(texto, erros) {
      const padrao = /(?<![\wÀ-ÿ.])@([\wÀ-ÿ]+(?:\.[\wÀ-ÿ]+)*)/g;

      return texto.replace(padrao, function (trecho, usuario) {
        const chave = usuario.toLowerCase();

        if (!Object.hasOwn(pessoas, chave)) {
          erros.push("Menção desconhecida: " + trecho);
          return marcarErro(trecho);
        }

        mencoesTraduzidas++;
        return pessoas[chave];
      });
    }

    // Desafio 1: substituirHashtags com contador
    function substituirHashtagsDesafio(texto, erros) {
      const padrao = /#([\wÀ-ÿ]+)(?::([\wÀ-ÿ]+))?/g;

      return texto.replace(padrao, function (trecho, categoria, valor) {
        if (valor === undefined) {
          erros.push(
            "Hashtag em formato inválido: " + trecho + " (use #categoria:valor)"
          );
          return marcarErro(trecho);
        }

        const chave = (categoria + ":" + valor).toLowerCase();

        if (!Object.hasOwn(emojis, chave)) {
          erros.push("Hashtag desconhecida: " + trecho);
          return marcarErro(trecho);
        }

        hashtagsTraduzidas++;
        return emojis[chave];
      });
    }

    // Desafio 4: $texto$ deixa o texto em negrito
    function substituirNegrito(texto) {
      const padrao = /\$([^$]+)\$/g;

      return texto.replace(padrao, function (trecho, conteudo) {
        return "<strong>" + conteudo + "</strong>";
      });
    }

    // traduzir usando as funções dos desafios
    function traduzirDesafio() {
      const erros = [];
      mencoesTraduzidas = 0;
      hashtagsTraduzidas = 0;

      let texto = escaparHtml(document.getElementById("entrada").value);

      texto = substituirMencoesDesafio(texto, erros);
      texto = substituirHashtagsDesafio(texto, erros);
      texto = substituirNegrito(texto);

      document.getElementById("saida").innerHTML = texto;

      document.getElementById("contador").textContent =
        "Menções traduzidas: " + mencoesTraduzidas +
        " | Hashtags traduzidas: " + hashtagsTraduzidas;

      const lista = document.getElementById("erros");
      lista.innerHTML = "";

      if (erros.length === 0) {
        lista.innerHTML = "<li>Nenhum erro encontrado.</li>";
      }

      for (const mensagem of erros) {
        const item = document.createElement("li");
        item.className = "erro";
        item.textContent = mensagem;
        lista.appendChild(item);
      }
    }

    document.getElementById("botao").removeEventListener("click", traduzir);
    document.getElementById("botao").addEventListener("click", traduzirDesafio);
  </script>
</body>
</html>
